# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: devreliance-health.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: postman-devrel-900197
        branch: main
      launch: dashboard
title: MyHealthcare.dev | Documentation
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: Docs
    icon: home
  API Reference:
    display-name: API Reference
    icon: puzzle
navigation:
  - tab: home
    layout:
      - section: Overview
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-house
          - page: Goals
            path: docs/pages/goals.mdx
            icon: fa-duotone fa-bullseye-arrow
      - section: The platform
        contents:
          - page: Business domains
            path: docs/pages/domains.mdx
            icon: fa-duotone fa-hospital
          - page: Use cases
            path: docs/pages/use-cases.mdx
            icon: fa-duotone fa-diagram-project
      - section: Get started
        contents:
          - page: Run it locally
            path: docs/pages/run-locally.mdx
            icon: fa-duotone fa-terminal
  - tab: API Reference
    layout:
      - section: Overview
        contents:
          - page: API reference
            path: docs/pages/api-reference-overview.mdx
            icon: fa-duotone fa-book
      # Every service spec is composed into one API; api-name matches the
      # fern/apis/ folder. Per-service grouping comes from the namespaces
      # declared in that folder's generators.yml.
      - api: healthcare-org
        api-name: healthcare-org
        flattened: false
navbar-links:
  - type: filled
    text: Edit
    url: https://dashboard.buildwithfern.com
colors:
  # Postman 2026 brand palette.
  #
  # Light mode uses O:80, the only official orange that clears WCAG AA on white:
  # O:60 (the hero orange) is 2.82:1 and O:70 is 3.87:1, both under 4.5:1.
  # O:80 is 6.00:1. Fern still emits an advisory asking for 7:1 (AAA) — reaching
  # that would need a near-black accent, so AA is where this stops.
  #
  # Dark mode keeps the hero orange: O:60 is 7.15:1 on #0C0319, AAA already.
  accent-primary:
    light: "#B03C12"
    dark: "#FF6C37"
  background:
    light: "#FFFFFF"
    dark: "#0C0319"
  border:
    light: "#8B5CF6"
    dark: "#8B5CF6"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/wordmark-dark.svg
  light: docs/assets/wordmark-light.svg
  height: 20
  href: /
favicon: docs/assets/Postman_Logomark_orange.svg
css:
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
